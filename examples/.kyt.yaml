# Kyt Configuration
# Diff command configuration
diff:
  # Ignore differences for specific resources
  ignoreDifferences:
    # Ignore common metadata labels for all resources
    - group: ""
      kind: "*"
      jsonPointers:
        - /metadata/labels/app.kubernetes.io~1version
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration

    # Ignore Istio sidecars in Deployments
    - group: "apps"
      kind: "Deployment"
      jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "istio-proxy")
        - .spec.template.spec.initContainers[] | select(.name == "istio-init")
        - .spec.template.metadata.annotations["sidecar.istio.io/status"]

    # Ignore replica count differences in production
    - group: "apps"
      kind: "Deployment"
      namespace: "production"
      jsonPointers:
        - /spec/replicas 

    # Ignore HPA-managed fields
    - group: "apps"
      kind: "Deployment"
      managedFieldsManagers:
        - "kube-controller-manager"

  # Normalization options
  normalization:
    # Sort object keys alphabetically
    sortKeys: true

    # Sort arrays where order doesn't matter
    sortArrays:
      - path: ".spec.template.spec.containers[].ports"
        sortBy: "containerPort"
      - path: ".spec.template.spec.containers[].env"
        sortBy: "name"
      - path: ".spec.template.spec.volumes"
        sortBy: "name"

    # Remove fields that shouldn't be compared
    removeDefaultFields:
      - "/status"
      - "/metadata/managedFields"
      - "/metadata/creationTimestamp"
      - "/metadata/generation"
      - "/metadata/resourceVersion"
      - "/metadata/uid"

  # Diff options
  options:
    contextLines: 3 # Context lines for unified diff (default: 3)
    similarityThreshold: 0.7 # Min similarity score for matching resources (0.0-1.0, default: 0.7)
    dataSimilarityBoost: 2 # Boost factor for ConfigMap/Secret data fields (1-10, default: 2)
                           # Higher values give more weight to data content vs metadata
                           # Useful for matching ConfigMaps with different names but same data

  # Fuzzy string matching configuration
  fuzzyMatching:
    # Enable Levenshtein distance for comparing similar strings
    # When disabled, only exact string matches are considered equal
    # This is especially useful for ConfigMaps with large data fields that differ slightly
    enabled: true # default: true
    
    # Minimum string length (in characters) to apply fuzzy matching
    # Strings shorter than this use exact comparison
    # Higher values = faster but less accurate for short strings
    # Lower values = slower but more accurate
    minStringLength: 100 # default: 100

  # Default resource filters (can be overridden by CLI flags)
  # CLI flags take precedence over these settings
  filters:
    # Resource kinds to include/exclude
    # Use "-" prefix for exclusions
    # Examples:
    #   kinds: ["Deployment", "StatefulSet"]  # include only these
    #   kinds: ["-Secret", "-ConfigMap"]      # exclude these
    kinds: []
    
    # Namespaces to include/exclude
    # Use "-" prefix for exclusions
    # Note: Cluster-scoped resources (ClusterRole, Node, etc.) are excluded when namespace filters are active
    # Examples:
    #   namespaces: ["production", "staging"]  # include only these
    #   namespaces: ["-kube-system", "-kube-public"]  # exclude system namespaces
    namespaces: []

  # Secret masking configuration (UPDATED in v0.5.0)
  # Pattern-based masking for Kubernetes Secret data/stringData values
  # Prevents credential leaks in CI/CD logs while preserving differences
  secretMasking:
    # Enable/disable Secret masking (default: true)
    # When enabled, Secret values are masked using pattern-based rules
    enabled: true
    
    # Global mask character (default: "*")
    # Can be overridden per-rule
    maskChar: "*"
    
    # Secret fields to mask (default: ["data", "stringData"])
    fields: ["data", "stringData"]
    
    # Pattern-based masking rules (evaluated in order, first match wins)
    # Each rule uses regex with named capture groups
    # Strategies: "mask-F-E" (keep first F, last E chars) or "mask-F-E-S-M" (sequenced)
    rules:
      # PostgreSQL/MySQL connection strings
      - name: "postgres"
        description: "PostgreSQL/MySQL database connection strings"
        pattern: '^postgres(?:ql)?://(?<user>[^:]+):(?<password>[^@]+)@(?<host>.+)$'
        masks:
          user: "mask-2-0"        # Keep first 2 chars of username
          password: "mask-2-2"    # Keep first 2 and last 2 chars of password
          host: "mask-0-10"       # Keep last 10 chars of host (shows port/db)
      
      # MongoDB connection strings
      - name: "mongodb"
        description: "MongoDB connection strings"
        pattern: '^mongodb(?:\+srv)?://(?<user>[^:]+):(?<password>[^@]+)@(?<host>.+)$'
        masks:
          user: "mask-2-0"        # Keep first 2 chars
          password: "mask-0-4"    # Keep last 4 chars
          host: "mask-0-20"       # Keep last 20 chars (shows cluster/db)
      
      # Redis connection strings
      - name: "redis"
        description: "Redis connection strings"
        pattern: '^redis://(?::(?<password>[^@]+)@)?(?<host>.+)$'
        masks:
          password: "mask-2-2"
          host: "mask-0-10"
      
      # API keys with prefixes (AWS, Stripe, etc.)
      - name: "api-key-prefix"
        description: "API keys with identifying prefixes"
        pattern: '^(?<prefix>(?:sk|pk|AKIA|ASIA)_[a-zA-Z0-9_]+_)(?<secret>[A-Za-z0-9+/=]+)$'
        masks:
          prefix: "mask-0-0"      # Fully mask prefix (security)
          secret: "mask-4-4"      # Keep first/last 4 chars of secret
      
      # JWT tokens
      - name: "jwt"
        description: "JSON Web Tokens"
        pattern: '^(?<header>[^.]+)\.(?<payload>[^.]+)\.(?<signature>.+)$'
        masks:
          header: "mask-0-4"      # Keep last 4 chars
          payload: "mask-4-4"     # Keep first/last 4 chars
          signature: "mask-0-0"   # Fully mask signature
      
      # Generic base64-encoded secrets (catch-all)
      - name: "base64"
        description: "Base64-encoded values (fallback)"
        pattern: '^(?<value>[A-Za-z0-9+/]+=*)$'
        masks:
          value: "mask-4-4"       # Keep first/last 4 chars
      
      # Default fallback for any other format
      - name: "default"
        description: "Default masking for all other secrets"
        pattern: '^(?<value>.+)$'
        masks:
          value: "mask-2-2"       # Keep first/last 2 chars
    
    # Sequenced masking example (for complex credentials):
    # Useful when simple first/last masking hides actual differences
    # Example: mask-2-2-5-1 means:
    #   - Keep first 2 chars
    #   - Keep last 2 chars  
    #   - In middle: mask 5, keep 1, repeat
    # "1234567890abcdefgh" → "12*****8*****d**gh"
    # This reveals pattern structure while masking sensitive parts
    
    # To temporarily disable masking, use CLI flag:
    #   kyt diff --mask-secrets=false ./left ./right
    # Or to exclude Secrets entirely:
    #   kyt diff --kind=-Secret ./left ./right
  
  # Optional: pipe output through external diff viewer
  # Only used when stdout is a terminal
  pager: "" # Examples: "delta --side-by-side", "bat --language=diff", "less -R"
