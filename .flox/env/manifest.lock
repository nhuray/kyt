{
  "lockfile-version": 1,
  "manifest": {
    "version": 1,
    "install": {
      "coreutils": {
        "pkg-path": "coreutils"
      },
      "git": {
        "pkg-path": "git"
      },
      "gnumake": {
        "pkg-path": "gnumake"
      },
      "go": {
        "pkg-path": "go",
        "version": "^1.26.0"
      },
      "iana-etc": {
        "pkg-path": "iana-etc"
      },
      "mailcap": {
        "pkg-path": "mailcap"
      },
      "tzdata": {
        "pkg-path": "tzdata"
      }
    },
    "hook": {
      "on-activate": "  # Welcome message\n  echo \"kyt development environment activated\"\n  echo \"Run 'flox build kyt' to build the project\"\n"
    },
    "profile": {},
    "options": {},
    "build": {
      "kyt": {
        "command": "set -euo pipefail\n\n# Extract version from manifest.toml in the source directory\nMANIFEST_FILE=\".flox/env/manifest.toml\"\nif [ -f \"$MANIFEST_FILE\" ]; then\n  MANIFEST_VERSION=$(grep -A 3 '^\\[build\\.kyt\\]' \"$MANIFEST_FILE\" | grep '^version' | cut -d'\"' -f2)\nelse\n  MANIFEST_VERSION=\"0.0.0\"\nfi\n\n# Use manifest version if set and not 0.0.0, otherwise fall back to git describe\nif [ -n \"$MANIFEST_VERSION\" ] && [ \"$MANIFEST_VERSION\" != \"0.0.0\" ]; then\n  VERSION=\"$MANIFEST_VERSION\"\nelse\n  VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo \"dev\")\nfi\n\nCOMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo \"none\")\nDATE=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\n\necho \"Building kyt version: $VERSION (commit: $COMMIT)\"\n\n# Create output directories\nmkdir -p \"$out/bin\"\nmkdir -p \"$out/share/doc/kyt\"\nmkdir -p \"$out/share/examples/kyt\"\n\n# Build the binary with version info\nenv CGO_ENABLED=0 go build \\\n  -ldflags \"-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE\" \\\n  -trimpath \\\n  -o \"$out/bin/kyt\" \\\n  ./cmd/kyt\n\n# Verify the binary was created\nif [ ! -f \"$out/bin/kyt\" ]; then\n  echo \"Error: Failed to build kyt binary\"\n  exit 1\nfi\n\n# Make it executable\nchmod +x \"$out/bin/kyt\"\n\n# Copy documentation\ncp README.md LICENSE \"$out/share/doc/kyt/\"\nif [ -d \"docs\" ]; then\n  cp -r docs/* \"$out/share/doc/kyt/\"\nfi\n\n# Copy example configuration\nif [ -f \"examples/.kyt.yaml\" ]; then\n  cp examples/.kyt.yaml \"$out/share/examples/kyt/example-config.yaml\"\nfi\n\necho \"✓ Build completed successfully\"\n",
        "runtime-packages": [
          "tzdata",
          "mailcap",
          "iana-etc"
        ],
        "sandbox": "pure",
        "version": "0.0.0",
        "description": "Kubernetes YAML Toolkit - Format and compare manifests with intelligent ignore rules"
      },
      "kyt-tests": {
        "command": "set -euo pipefail\n\nmkdir -p \"$out/test-results\"\n\necho \"Running tests...\"\ngo test -v ./... 2>&1 | tee \"$out/test-results/test.log\"\n\necho \"Running tests with coverage...\"\ngo test -coverprofile=\"$out/test-results/coverage.out\" ./...\n\necho \"✓ Tests completed\"\n",
        "sandbox": "pure",
        "version": "0.0.0",
        "description": "Run kyt test suite"
      }
    }
  },
